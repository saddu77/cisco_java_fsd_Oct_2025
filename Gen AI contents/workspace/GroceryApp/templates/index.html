<!DOCTYPE html>
<html>
<head>
    <title>Grocery List</title>
</head>
<body>

<h2>Grocery Items</h2>

<a href="/add">Add New Item</a>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Quantity</th>
    </tr>

    {% for item in items %}
    <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.quantity }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
