<!-- Create a Single Page Profile using html5 and bootstrap -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .profile-header {
            background-color: #343a40;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            margin-top: -75px;
        }
        .profile-info {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="profile-header">
        <img src="https://via.placeholder.com/150" alt="Profile Image" class="profile-image">
        <h1 class="mt-3">John Doe</h1>
        <p>Web Developer | Designer | Content Creator</p>
    </div>

    <div class="container profile-info">
        <div class="row">
            <div class="col-md-4">
                <h3>About Me</h3>
                <p>Hello! I'm John, a passionate web developer with over 5 years of experience in creating dynamic and responsive websites. I love coding and design, and I'm always eager to learn new technologies.</p>
            </div>

                <h3>Skills</h3>
                <ul>
