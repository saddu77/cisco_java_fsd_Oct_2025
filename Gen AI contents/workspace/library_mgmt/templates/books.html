{% extends 'base.html' %}
{% block content %}
<h2>Books</h2>
<a href="/add_book" class="btn btn-success">Add Book</a>

<table class="table mt-3">
<tr>
<th>ID</th><th>Title</th><th>Author</th><th>Qty</th>
</tr>
{% for b in books %}
<tr>
<td>{{b.id}}</td>
<td>{{b.title}}</td>
<td>{{b.author}}</td>
<td>{{b.quantity}}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
